<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EXDBIO | Exiled Scripts</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Courier New', monospace;
            color: #e0e0e0;
            padding: 0;
            transition: background 0.2s;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            padding-bottom: 20px;
            border-bottom: 1px solid #2c2c2c;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff, #b0b0b0);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #1f1f1f;
            border: 2px solid #5a5a5a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #aaa;
        }

        .header-meta {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .stat-box {
            background: #0f0f0f;
            border: 1px solid #2c2c2c;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
        }

        .stat-icon {
            color: #7a7a7a;
            font-size: 14px;
        }

        .stat-value {
            font-weight: 600;
            color: #fff;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            border-radius: 16px;
            border: 1px dashed #2c2c2c;
        }

        .empty-state-icon {
            font-size: 48px;
            color: #3a3a3a;
            margin-bottom: 12px;
            opacity: 0.6;
        }

        .empty-state-text {
            color: #5a5a5a;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .scripts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
            margin-top: 30px;
        }

        .card {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            border: 1px solid #262626;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .card:hover {
            border-color: #5a5a5a;
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        }

        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: #aaa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 10;
            font-size: 14px;
            opacity: 0;
        }

        .card:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: rgba(255, 0, 0, 0.3);
            border-color: #ff4444;
            color: #ff6666;
        }

        .card-img {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #2c2c2c;
            position: relative;
            overflow: hidden;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .card:hover .card-img img {
            transform: scale(1.05);
        }

        .card-no-img {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            color: #4f4f4f;
        }

        .card-no-img i {
            font-size: 32px;
            opacity: 0.5;
        }

        .card-content {
            padding: 20px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 12px;
            word-break: break-word;
            color: #f0f0f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title-icon {
            color: #7a7a7a;
            font-size: 16px;
        }

        .code-snippet {
            background: #030303;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 110px;
            overflow-y: auto;
            border: 1px solid #2a2a2a;
            margin: 12px 0;
            color: #7a7a7a;
            line-height: 1.4;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #1f1f1f;
        }

        .copy-btn {
            background: #1f1f1f;
            border: 1px solid #3a3a3a;
            padding: 8px 14px;
            border-radius: 6px;
            color: #ddd;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .copy-btn:hover {
            background: #2e2e2e;
            border-color: #6a6a6a;
            color: white;
        }

        .copy-btn i {
            font-size: 12px;
        }

        .timestamp {
            font-size: 0.7rem;
            color: #5e5e5e;
        }

        .secret-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .secret-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .post-modal {
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
            width: 90%;
            max-width: 520px;
            border: 1px solid #3a3a3a;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.08);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .modal-header-icon {
            font-size: 24px;
            color: #7a7a7a;
        }

        .post-modal h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f0f0f0;
            letter-spacing: -0.5px;
        }

        .modal-description {
            font-size: 0.8rem;
            color: #6a6a6a;
            margin-bottom: 20px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            font-size: 0.8rem;
            color: #8a8a8a;
            margin-bottom: 6px;
            display: block;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .post-modal input,
        .post-modal textarea,
        .post-modal input[type="file"] {
            width: 100%;
            background: #141414;
            border: 1px solid #2c2c2c;
            padding: 11px 14px;
            color: white;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            resize: vertical;
            transition: all 0.2s;
        }

        .post-modal input:focus,
        .post-modal textarea:focus {
            outline: none;
            border-color: #6a6a6a;
            background: #1a1a1a;
            box-shadow: 0 0 12px rgba(106, 106, 106, 0.2);
        }

        .post-modal textarea {
            min-height: 120px;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 14px;
            background: #141414;
            border: 1px solid #2c2c2c;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: #8a8a8a;
            font-size: 0.9rem;
        }

        .file-input-label:hover {
            border-color: #6a6a6a;
            color: #aaa;
        }

        .file-input-label i {
            font-size: 14px;
        }

        #postImage {
            display: none;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .post-modal button {
            flex: 1;
            background: #1f1f1f;
            border: 1px solid #5a5a5a;
            padding: 12px;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            cursor: pointer;
            color: white;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .post-modal button:hover {
            background: #2e2e2e;
            border-color: #8a8a8a;
        }

        .post-modal button i {
            font-size: 14px;
        }

        #confirmPostBtn {
            background: #2a2a2a;
        }

        #confirmPostBtn:hover {
            background: #3a3a3a;
        }

        .close-secret {
            background: #141414 !important;
            border-color: #3a3a3a !important;
        }

        .close-secret:hover {
            background: #1f1f1f !important;
        }

        .secret-hint {
            text-align: center;
            margin-top: 16px;
            font-size: 0.7rem;
            color: #4a4a4a;
            border-top: 1px solid #222;
            padding-top: 12px;
        }

        .toast-msg {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            border-left: 3px solid #7a7a7a;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 0.8rem;
            z-index: 1100;
            font-family: 'Courier New', monospace;
            color: #eee;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            display: none;
        }

        .toast-msg.show {
            display: block;
        }

        footer {
            margin-top: 80px;
            text-align: center;
            font-size: 0.75rem;
            color: #3e3e3e;
            border-top: 1px solid #1a1a1a;
            padding-top: 24px;
            padding-bottom: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 24px 16px;
            }

            .header {
                margin-bottom: 40px;
            }

            .logo h1 {
                font-size: 1.6rem;
            }

            .scripts-grid {
                grid-template-columns: 1fr;
            }

            .post-modal {
                width: 95%;
                padding: 24px;
            }

            .delete-btn {
                opacity: 1 !important;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5a5a5a;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-code"></i>
            </div>
            <h1>EXDBIO</h1>
        </div>
        <div class="header-meta">
            <div class="stat-box">
                <i class="fas fa-fire stat-icon"></i>
                <span>Scripts: <span class="stat-value" id="scriptCount">0</span></span>
            </div>
        </div>
    </div>

    <div class="scripts-grid" id="scriptsGrid">
        <div class="empty-state">
            <div class="empty-state-icon">
                <i class="fas fa-inbox"></i>
            </div>
            <div class="empty-state-text">
                <p>Nenhum script publicado.</p>
            </div>
        </div>
    </div>

    <footer>
        <p>EXDBIO &copy; 2025</p>
    </footer>
</div>

<div id="secretMenu" class="secret-overlay">
    <div class="post-modal">
        <div class="modal-header">
            <i class="fas fa-lock-open modal-header-icon"></i>
            <h2>Postar Script</h2>
        </div>
        <p class="modal-description">Apenas você sabe o caminho.</p>

        <div class="form-group">
            <label class="form-label">Título</label>
            <input type="text" id="postTitle" placeholder="Nome do script" autocomplete="off">
        </div>

        <div class="form-group">
            <label class="form-label">Código</label>
            <textarea id="postScript" placeholder="Cole o código aqui..."></textarea>
        </div>

        <div class="form-group">
            <label class="form-label">Imagem (Opcional)</label>
            <label class="file-input-label">
                <i class="fas fa-image"></i>
                <span>Selecionar imagem</span>
                <input type="file" id="postImage" accept="image/*">
            </label>
        </div>

        <div class="modal-actions">
            <button id="confirmPostBtn">
                <i class="fas fa-check"></i>
                Publicar
            </button>
            <button id="closeSecretBtn" class="close-secret">
                <i class="fas fa-times"></i>
                Fechar
            </button>
        </div>

        <div class="secret-hint">
            sequência disponível a qualquer momento
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-msg"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAIKPooiHzcB5d8_mRiDMyiam4AYel4lZs",
        authDomain: "cs-low-poly.firebaseapp.com",
        databaseURL: "https://cs-low-poly-default-rtdb.firebaseio.com",
        projectId: "cs-low-poly",
        storageBucket: "cs-low-poly.firebasestorage.app",
        messagingSenderId: "291417778108",
        appId: "1:291417778108:web:881869dd93735c6167edb9"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const scriptsRef = database.ref('posts');

    let scripts = [];

    function loadScriptsFromFirebase() {
        scriptsRef.on('value', (snapshot) => {
            scripts = [];
            const data = snapshot.val();
            if (data) {
                Object.entries(data).forEach(([key, value]) => {
                    scripts.push({ firebaseId: key, ...value });
                });
                scripts.sort((a, b) => b.timestamp - a.timestamp);
            }
            updateCounter();
            renderScripts();
        });
    }

    function updateCounter() {
        document.getElementById("scriptCount").innerText = scripts.length;
    }

    function imageToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    async function addNewScript(title, code, imageFile) {
        if (!title.trim() || !code.trim()) {
            showToast("Título e script são obrigatórios.", 2000);
            return false;
        }

        let imageData = null;
        if (imageFile && imageFile.type.startsWith('image/')) {
            try {
                imageData = await imageToBase64(imageFile);
            } catch (e) {
                console.warn("erro ao processar imagem");
            }
        }

        const newScript = {
            title: title.trim(),
            code: code.trim(),
            imageData: imageData || null,
            timestamp: Date.now()
        };

        try {
            await scriptsRef.push(newScript);
            showToast("Script publicado com sucesso", 2500);
            return true;
        } catch (error) {
            showToast("Erro ao publicar script", 2000);
            console.error(error);
            return false;
        }
    }

    function deleteScript(firebaseId) {
        if (!firebaseId) return;
        scriptsRef.child(firebaseId).remove().then(() => {
            showToast("Script removido", 1500);
        }).catch((error) => {
            showToast("Erro ao remover script", 2000);
            console.error(error);
        });
    }

    function renderScripts() {
        const grid = document.getElementById("scriptsGrid");

        if (!scripts.length) {
            grid.innerHTML = `<div class="empty-state"><div class="empty-state-icon"><i class="fas fa-inbox"></i></div><div class="empty-state-text"><p>Nenhum script publicado.</p></div></div>`;
            return;
        }

        grid.innerHTML = "";

        scripts.forEach(script => {
            const card = document.createElement("div");
            card.className = "card";

            const deleteBtn = document.createElement("button");
            deleteBtn.className = "delete-btn";
            deleteBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
            deleteBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                deleteScript(script.firebaseId);
            });
            card.appendChild(deleteBtn);

            const imgDiv = document.createElement("div");
            imgDiv.className = "card-img";

            if (script.imageData && script.imageData.startsWith("data:image")) {
                const img = document.createElement("img");
                img.src = script.imageData;
                img.alt = script.title;
                imgDiv.appendChild(img);
            } else {
                const noImg = document.createElement("div");
                noImg.className = "card-no-img";
                noImg.innerHTML = `<i class="fas fa-image"></i><span>Sem imagem</span>`;
                imgDiv.appendChild(noImg);
            }

            const contentDiv = document.createElement("div");
            contentDiv.className = "card-content";

            const titleEl = document.createElement("div");
            titleEl.className = "card-title";
            titleEl.innerHTML = `<i class="fas fa-file-code card-title-icon"></i><span>${script.title}</span>`;

            const codeEl = document.createElement("div");
            codeEl.className = "code-snippet";
            codeEl.innerText = script.code.length > 300 ? script.code.slice(0, 300) + "..." : script.code;

            const footer = document.createElement("div");
            footer.className = "card-footer";

            const copyBtn = document.createElement("button");
            copyBtn.className = "copy-btn";
            copyBtn.innerHTML = `<i class="fas fa-copy"></i> Copiar`;
            copyBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                navigator.clipboard.writeText(script.code).then(() => {
                    showToast(`"${script.title}" copiado para área de transferência`, 1800);
                }).catch(() => showToast("Erro ao copiar", 1000));
            });

            const timeSpan = document.createElement("span");
            timeSpan.className = "timestamp";
            const date = new Date(script.timestamp);
            timeSpan.innerText = `${date.toLocaleDateString()} ${date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

            footer.appendChild(copyBtn);
            footer.appendChild(timeSpan);
            contentDiv.appendChild(titleEl);
            contentDiv.appendChild(codeEl);
            contentDiv.appendChild(footer);
            card.appendChild(imgDiv);
            card.appendChild(contentDiv);
            grid.appendChild(card);
        });
    }

    function showToast(msg, duration = 2000) {
        const toast = document.getElementById("toastMsg");
        toast.innerText = msg;
        toast.classList.add("show");
        setTimeout(() => {
            toast.classList.remove("show");
        }, duration);
    }

    let sequenceBuffer = [];
    const secretCode = ["KeyX", "KeyE", "KeyN", "KeyO", "KeyS", "KeyC"];

    function handleKeydown(e) {
        console.log("Tecla pressionada:", e.code);
        
        sequenceBuffer.push(e.code);
        while (sequenceBuffer.length > secretCode.length) sequenceBuffer.shift();

        console.log("Sequência atual:", sequenceBuffer.join(" -> "));

        let match = true;
        for (let i = 0; i < sequenceBuffer.length; i++) {
            if (sequenceBuffer[i] !== secretCode[i]) {
                match = false;
                break;
            }
        }

        if (match && sequenceBuffer.length === secretCode.length) {
            console.log("✓ SEQUÊNCIA CORRETA DETECTADA!");
            openSecretMenu();
            sequenceBuffer = [];
            showToast("Acesso Concedido", 2000);
            e.preventDefault();
        }
    }

    function openSecretMenu() {
        const overlay = document.getElementById("secretMenu");
        overlay.classList.add("active");
        document.getElementById("postTitle").value = "";
        document.getElementById("postScript").value = "";
        document.getElementById("postImage").value = "";
    }

    function closeSecretMenu() {
        const overlay = document.getElementById("secretMenu");
        overlay.classList.remove("active");
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadScriptsFromFirebase();

        console.log("%c🔐 SEQUÊNCIA: XENOSC (X E N O S C)", "color: #7a7a7a; font-size: 12px;");

        window.addEventListener("keydown", handleKeydown);

        document.getElementById("confirmPostBtn").addEventListener("click", async () => {
            const title = document.getElementById("postTitle").value;
            const scriptCode = document.getElementById("postScript").value;
            const file = document.getElementById("postImage").files[0];
            const success = await addNewScript(title, scriptCode, file);
            if (success) {
                closeSecretMenu();
            }
        });

        document.getElementById("closeSecretBtn").addEventListener("click", closeSecretMenu);

        document.getElementById("secretMenu").addEventListener("click", (e) => {
            if (e.target.id === "secretMenu") {
                closeSecretMenu();
            }
        });
    });
</script>

</body>
</html>
